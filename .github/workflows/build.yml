name: build

# 构建三个 app 模块的 release APK。
# 每个 ABI 一个矩阵腿：setup_maa_framework.py 把该 ABI 的 .so 铺进 core/src/main/jniLibs/<abi>/，
# 再由 Gradle 打进 APK（abiFilters 也被 -Pmaapocket.abis 收到同一个 ABI）。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      maafw_version:
        description: 'MaaFramework release tag（留空 = 用 gradle.properties 里的 maafw.version）'
        required: false
        type: string
        default: ''
      abis:
        description: '要构建的 ABI，逗号分隔'
        required: false
        type: string
        default: 'arm64-v8a,x86_64'

# 同一分支/PR 上新的 run 直接掐掉旧的，别排队烧 runner
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# agent（Go 交叉编译）用的常量。
# 注意：这几个值在 .github/workflows/build-agents.yml 里还有一份（那是独立 workflow）。
# 本 workflow 刻意**内联** go agent 的构建而不是下载它的 artifact（理由见 build job 里的注释），
# 因此下面的 Guard 步骤会强制校验两处逐字一致：改一处忘另一处会立刻红，而不是悄悄用错 MaaEnd commit。
env:
  MAAEND_REPO: MaaEnd/MaaEnd
  # 必须与 build-agents.yml 的 MAAEND_REF 一致（也与 prepare-packs.yml 对齐，见那边的注释）。
  MAAEND_REF: ae43a184c02408410061c858a46205cf90606a26
  GO_VERSION: '1.25.6'
  # Go 的 android 端口强制走 external linking，所以 NDK 是必需而非可选（见 docs/agents.md §5）。
  NDK_VERSION: '29.0.13113456'
  GOTOOLCHAIN: local

jobs:
  # 把 workflow_dispatch 的 abis 输入（或 push/pr 的默认值）变成矩阵。
  # 单独一个 job 是因为 strategy.matrix 不能直接消费 shell，需要 fromJSON 一个真实数组。
  # job id 用下划线不用连字符：`needs.<id>` 里的 `-` 会被表达式解析成减号。
  resolve_abis:
    name: resolve abi matrix
    runs-on: ubuntu-latest
    outputs:
      abis: ${{ steps.resolve.outputs.abis }}
    steps:
      - name: Resolve ABI matrix
        id: resolve
        shell: bash
        env:
          INPUT_ABIS: ${{ github.event.inputs.abis }}
        run: |
          set -euo pipefail
          raw="${INPUT_ABIS:-arm64-v8a,x86_64}"
          json="$(python3 -c 'import json,sys; print(json.dumps([a.strip() for a in sys.argv[1].split(",") if a.strip()]))' "$raw")"
          echo "abis=$json" >> "$GITHUB_OUTPUT"
          echo "abi matrix: $json"

  build:
    name: build ${{ matrix.abi }}
    needs: resolve_abis
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        abi: ${{ fromJSON(needs.resolve_abis.outputs.abis) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 注意：不能省 packages。setup-android 的默认值是 `tools platform-tools`，
      # 但新版 cmdline-tools(16.0) 的 sdkmanager 里已经没有 `tools` 这个包了，
      # 会以 `Warning: Failed to find package 'tools'` 直接 exit 1（run 37124614990 的根因）。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "ndk;${NDK_VERSION}" "cmake;3.22.1"
          sdkmanager --list_installed

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # 依赖 scripts/setup_maa_framework.py —— 单独一步，失败时一眼看出是抓原生库挂了还是编译挂了
      - name: Fetch MaaFramework native libs (scripts/setup_maa_framework.py)
        shell: bash
        env:
          MAAFW_VERSION: ${{ github.event.inputs.maafw_version }}
          ABI: ${{ matrix.abi }}
        run: |
          set -euo pipefail
          args=(--abi "$ABI")
          if [ -n "${MAAFW_VERSION:-}" ]; then
            args+=(--tag "$MAAFW_VERSION")
          fi
          echo "==> python scripts/setup_maa_framework.py ${args[*]}"
          python scripts/setup_maa_framework.py "${args[@]}"

      # ---------------------------------------------------------------- agent 产物（Go）
      # 为什么把 go agent 的构建**内联**在本 job，而不是下载 build-agents.yml 上传的
      # maaend-go-agent-<abi>：
      #   · 跨 workflow 取产物是抢占式依赖：build-agents.yml 只在它自己的 paths 命中（push）
      #     或被手动触发时才跑，普通 push/PR 上「当前 commit 一定有该 artifact」并不成立，
      #     `gh run download` / dawidd6/action-download-artifact 会时好时坏 —— 等于给主构建
      #     引入了与代码质量无关的随机失败；
      #   · 改成 `workflow_run` 触发器又会把 build.yml 现有的 push/PR 触发语义整体换掉，
      #     而且只在默认分支上可靠；
      #   · 内联是自包含的：checkout 上游 → go build → 铺进 core，全部由本 job 决定，
      #     没有跨 run 的时序依赖，也不需要多传一路 artifact（每个 ABI 腿本来就要各自构建）。
      # 代价：MAAEND_REF / GO_VERSION / NDK_VERSION 在本文件出现第二份拷贝，
      # 所以紧接着一步就是守卫脚本，把两处绑死。
      - name: Guard - agent build constants must match build-agents.yml
        shell: bash
        run: |
          set -euo pipefail
          upstream=.github/workflows/build-agents.yml
          [ -f "$upstream" ] || { echo "::error::$upstream 不存在"; exit 1; }
          ref_up="$(grep -oE '[0-9a-f]{40}' "$upstream" | head -1)"
          go_up="$(grep -E '^[[:space:]]*GO_VERSION:' "$upstream" | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1)"
          ndk_up="$(grep -E '^[[:space:]]*NDK_VERSION:' "$upstream" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          echo "build.yml        : ref=$MAAEND_REF go=$GO_VERSION ndk=$NDK_VERSION"
          echo "build-agents.yml : ref=$ref_up go=$go_up ndk=$ndk_up"
          rc=0
          [ "$ref_up" = "$MAAEND_REF" ] || { echo "::error::MAAEND_REF 与 build-agents.yml 不一致（$MAAEND_REF vs $ref_up）"; rc=1; }
          [ "$go_up" = "$GO_VERSION" ] || { echo "::error::GO_VERSION 与 build-agents.yml 不一致（$GO_VERSION vs $go_up）"; rc=1; }
          [ "$ndk_up" = "$NDK_VERSION" ] || { echo "::error::NDK_VERSION 与 build-agents.yml 不一致（$NDK_VERSION vs $ndk_up）"; rc=1; }
          exit "$rc"

      # 与 build-agents.yml 完全同参：完整 checkout（不能 sparse —— 脚本要读 assets/locales/），
      # fetch-depth: 1 省时间，pin 到 MAAEND_REF 保证可复现。
      - name: Checkout MaaEnd (upstream, pinned)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MAAEND_REPO }}
          ref: ${{ env.MAAEND_REF }}
          path: upstream/MaaEnd
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: upstream/MaaEnd/agent/go-service/go.sum

      # 缺文件时早点失败：否则 go build 会在几百行后的报错里才暴露「上游改了目录结构」。
      - name: Preflight - check MaaEnd agent inputs
        shell: bash
        run: |
          set -uo pipefail
          rc=0
          for f in \
            upstream/MaaEnd/agent/go-service/go.mod \
            upstream/MaaEnd/agent/go-service/go.sum \
            upstream/MaaEnd/assets/locales/go-service/zh_cn.json \
            upstream/MaaEnd/assets/locales/interface/zh_cn.json
          do
            if [ ! -f "$f" ]; then echo "::error file=$f::$f 不存在（MaaEnd 目录结构变了？）"; rc=1; fi
          done
          exit "$rc"

      # NDK 用上面 `Install NDK and CMake` 装好的那一份（同一个 NDK_VERSION），
      # 路径就是脚本 locate_ndk() 的兜底位置 $ANDROID_SDK_ROOT/ndk/<version>。
      - name: Build go agent (${{ matrix.abi }})
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_go_agent.py \
            --source upstream/MaaEnd \
            --out dist/agents \
            --abi "${{ matrix.abi }}" \
            --ndk "${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"

      # 产物是「名字像库、内容是可执行文件」的 ELF，架构错了在运行期才炸（而且报错离这里很远），
      # 所以在这里就核对 e_machine / 字节序 / 是 PIE（Android 5.0+ 拒绝执行 ET_EXEC）。
      - name: Verify go agent ELF (${{ matrix.abi }})
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${{ matrix.abi }}" <<'PY'
          import struct, sys, pathlib
          want = {"arm64-v8a": 0xB7, "x86_64": 0x3E}[sys.argv[1]]
          p = pathlib.Path("dist/agents") / sys.argv[1] / "libMaaEnd_go_service.so"
          head = p.read_bytes()[:64]
          assert head[:4] == b"\x7fELF", f"{p}: 不是 ELF"
          assert head[5] == 1, f"{p}: 不是小端序 (EI_DATA={head[5]})"
          e_type, e_machine = struct.unpack_from("<HH", head, 16)
          assert e_machine == want, f"{p}: e_machine=0x{e_machine:X}, 期望 0x{want:X}"
          assert e_type != 2, f"{p}: ET_EXEC（非 PIE），Android 5.0+ 不会执行它"
          print(f"ok: {p} e_machine=0x{e_machine:X} e_type={e_type} bytes={p.stat().st_size}")
          PY

      # 铺进 Gradle 真正会打包的位置：
      #   · 可执行文件必须落 **app-endfield**/src/main/jniLibs/<abi>/lib*.so —— 只有匹配 lib*.so
      #     的文件才会被当作原生库安装到应用私有目录并拿到 x 权限（Android 不允许从 assets execve）；
      #   · locale bundle 进 **app-endfield**/assets/pi-agent-bundle/go-service/，由 AgentWorkspace
      #     在启动前解到 agent 的工作目录（Go agent 以 locales/go-service/zh_cn.json 的存在判定 locale 目录）。
      #
      # 为什么钉在 app-endfield 而不是 core：
      #   这是 MaaEnd 专属的 agent（Go，单文件 ELF 解包后 14 MB）。放在 :core 里会被三个 APK 各带一份，
      #   而崩铁 / 绝区零的 interface.json 的 `agent` 是空数组，根本不会用它 —— 真机实测
      #   `/data/app/**/com.maapocket.hsr-*/lib/arm64/libMaaEnd_go_service.so` 确实存在（14264632 B），
      #   即每个 hsr / zzz APK 白扛 14 MB。nativeLibraryDir 与 assets 都是**按 app 模块**合并的，
      #   所以只改落点即可，AgentRuntimeCatalog / AgentWorkspace 一行都不用动。
      - name: Install go agent into the Android source tree (${{ matrix.abi }})
        shell: bash
        run: |
          set -euo pipefail
          abi="${{ matrix.abi }}"
          src="dist/agents/${abi}"
          mod="app-endfield/src/main"
          [ -f "${src}/libMaaEnd_go_service.so" ] || { echo "::error::缺少 agent 产物 ${src}/libMaaEnd_go_service.so"; exit 1; }
          mkdir -p "${mod}/jniLibs/${abi}"
          cp "${src}/libMaaEnd_go_service.so" "${mod}/jniLibs/${abi}/libMaaEnd_go_service.so"
          chmod 755 "${mod}/jniLibs/${abi}/libMaaEnd_go_service.so"
          rm -rf "${mod}/assets/pi-agent-bundle/go-service"
          mkdir -p "${mod}/assets/pi-agent-bundle"
          cp -R "${src}/bundle/go-service" "${mod}/assets/pi-agent-bundle/go-service"
          marker="${mod}/assets/pi-agent-bundle/go-service/locales/go-service/zh_cn.json"
          [ -f "$marker" ] || { echo "::error::locale bundle 不完整，缺 $marker"; exit 1; }
          echo "jniLibs: $(ls -l ${mod}/jniLibs/${abi}/libMaaEnd_go_service.so)"
          echo "assets : $(find ${mod}/assets/pi-agent-bundle -type f | wc -l) 个文件"
          find ${mod}/assets/pi-agent-bundle/go-service -maxdepth 2 -type d | sort

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Assemble release APKs
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app-hsr:assembleRelease \
                    :app-zzz:assembleRelease \
                    :app-endfield:assembleRelease \
                    -Pmaapocket.abis=${{ matrix.abi }} \
                    --stacktrace

      # AGP 产出的名字（app-hsr-release.apk 之类）三个模块互不重名，但打进同一份 artifact
      # 后无法区分 ABI，所以先统一改名成 MaaPocket-<game>-<abi>.apk 再上传。
      - name: Collect and rename APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          found=0
          for game in hsr zzz endfield; do
            outdir="app-${game}/build/outputs/apk/release"
            [ -d "$outdir" ] || { echo "::warning::$outdir 不存在"; continue; }
            for apk in $(find "$outdir" -maxdepth 1 -name '*.apk' | sort); do
              case "$apk" in
                *-unsigned.apk) echo "skip unsigned: $apk"; continue ;;
              esac
              cp "$apk" "dist/MaaPocket-${game}-${{ matrix.abi }}.apk"
              echo "collected $apk -> dist/MaaPocket-${game}-${{ matrix.abi }}.apk"
              found=$((found + 1))
            done
          done
          echo "collected ${found} APK(s)"
          ls -l dist
          if [ "$found" -eq 0 ]; then
            echo "::error::没有收集到任何 APK"
            exit 1
          fi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: MaaPocket-apks-${{ matrix.abi }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Gradle reports and logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-reports-${{ matrix.abi }}
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
            /home/runner/.gradle/daemon/**/*.log
          if-no-files-found: warn
          retention-days: 7

  # 把两个 ABI 的 APK 汇总成一个 **GitHub Release**。
  # 为什么不是只留 actions artifact：artifact 下载必须带 token 走 api.github.com，
  # 在国内常被限速到几十 KB/s（一个 150 MB 的包要十几分钟）；release asset 是
  # 普通 CDN 文件，可以直接走 gh-proxy 之类的镜像，也能让用户不登录就下载。
  # tag 固定成 v0.1.0：URL 可预测，重新发布时 --clobber 覆盖同名资产。
  release:
    name: publish release
    needs: [resolve_abis, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: MaaPocket-apks-*
          path: dist
          merge-multiple: true

      - name: List collected APKs
        shell: bash
        run: |
          set -euo pipefail
          ls -l dist
          count=$(find dist -maxdepth 1 -name '*.apk' | wc -l)
          echo "APK 数量: $count"
          [ "$count" -gt 0 ] || { echo "::error::没有任何 APK 可发布"; exit 1; }

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.1.0
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "release $TAG 已存在，覆盖资产"
          else
            gh release create "$TAG" --repo "$REPO" \
              --title "MaaPocket v0.1.0" \
              --notes "自动构建：崩铁 / 绝区零 / 终末地的 MaaFramework-Android 迁移版 APK。每个 ABI 三个 APK（hsr / zzz / endfield）。内置 MaaFramework 原生库与 MaaEnd Go agent，约 40–60 MB/个。"
          fi
          gh release upload "$TAG" --repo "$REPO" --clobber dist/*.apk
          gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[] | "\(.name)  \(.size) bytes"'
